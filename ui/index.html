<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Death Star — Cilium Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js for 3-D Death Star sphere (self-hosted r160 UMD build) -->
  <script src="three.min.js"></script>
  <!-- Chart.js for rolling event-rate charts (self-hosted v4 UMD build) -->
  <script src="chart.min.js"></script>
</head>
<body>
  <div class="crt">

    <header>
      <h1>☠ DEATH STAR ☠</h1>
      <span id="event-counter" class="header-counter">EVENTS: 0</span>
    </header>

    <main>
      <!-- Death Star visual (left) -->
      <section class="station-section">
        <div class="station-wrapper">
          <!-- Three.js Death Star (canvas injected by app.js) -->
          <div id="deathstar-mount"></div>

          <!-- Impact flash layer -->
          <div id="impact-layer" aria-hidden="true"></div>

          <!-- Explosion overlay -->
          <div id="explosion" class="explosion hidden" aria-label="Explosion">
            <div class="exp-fireball"></div>
            <div class="exp-ring exp-ring-1"></div>
            <div class="exp-ring exp-ring-2"></div>
            <div class="exp-ring exp-ring-3"></div>
            <div class="exp-ring exp-ring-4"></div>
            <div class="exp-debris exp-debris-1"></div>
            <div class="exp-debris exp-debris-2"></div>
            <div class="exp-debris exp-debris-3"></div>
            <div class="exp-debris exp-debris-4"></div>
            <div class="exp-debris exp-debris-5"></div>
            <div class="exp-debris exp-debris-6"></div>
          </div>
        </div>

        <!-- Station status label -->
        <div id="station-status" class="station-status">OPERATIONAL</div>
      </section>

      <!-- Dashboard panels (right) -->
      <div class="dashboard">

        <!-- Charts row -->
        <div class="charts-row">
          <!-- By source IP -->
          <div class="chart-panel">
            <div class="panel-header">
              <span class="panel-title">REQUESTS / SOURCE IP</span>
              <span class="panel-subtitle">rolling 3 min</span>
            </div>
            <div class="chart-wrap">
              <canvas id="chart-source"></canvas>
            </div>
          </div>

          <!-- By endpoint -->
          <div class="chart-panel">
            <div class="panel-header">
              <span class="panel-title">REQUESTS / ENDPOINT</span>
              <span class="panel-subtitle">rolling 3 min</span>
            </div>
            <div class="chart-wrap">
              <canvas id="chart-endpoint"></canvas>
            </div>
          </div>
        </div>

        <!-- Event log -->
        <aside id="event-log">
          <div class="log-header">
            <h2>TRAFFIC LOG</h2>
            <button class="clear-btn" onclick="clearLog()">CLEAR</button>
          </div>
          <ul id="log-list" role="log" aria-live="polite" aria-label="Traffic events"></ul>
        </aside>

      </div><!-- .dashboard -->
    </main>

    <footer>
      <span id="conn-status" class="conn-connecting">⬤ CONNECTING…</span>
      <span class="footer-brand">CILIUM NETWORK SECURITY</span>
    </footer>

  </div><!-- .crt -->

  <script src="app.js"></script>
</body>
</html>
