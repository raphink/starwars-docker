server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use the system resolver (kube-dns in Kubernetes) for lazy upstream resolution.
    # This lets Nginx start even when "deathstar" is not yet reachable.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Proxy /api/* → Death Star service /v1/*
    # In Kubernetes, "deathstar" resolves via kube-dns to the ClusterIP service.
    # The variable form of proxy_pass triggers lazy resolution so Nginx boots before
    # the upstream is available.
    set $upstream http://deathstar;
    location /api/ {
        # Rewrite /api/<rest> → /v1/<rest> before proxying.
        # The rewrite + break is required when proxy_pass uses a variable,
        # because variable-form proxy_pass does not strip the location prefix.
        rewrite ^/api/(.*)$ /v1/$1 break;

        proxy_pass              $upstream;
        proxy_http_version      1.1;

        # SSE requires no buffering and a persistent connection.
        proxy_set_header        Connection "";
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        Host $host;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        chunked_transfer_encoding on;
    }

    # Serve static files; fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
