server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → Death Star service /v1/*
    # Nginx resolves "deathstar" at request time using the system resolver
    # (kube-dns in Kubernetes, the embedded resolver in Docker).
    location /api/ {
        proxy_pass              http://deathstar/v1/;
        proxy_http_version      1.1;

        # SSE requires no buffering and a persistent connection.
        proxy_set_header        Connection "";
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        Host $host;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        chunked_transfer_encoding on;
    }

    # Serve static files; fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
